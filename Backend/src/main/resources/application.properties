server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Kết nối SQL Server LocalDB qua Node TCP-to-Named-Pipe Bridge (Port 14333)
spring.datasource.url=jdbc:sqlserver://127.0.0.1:14333;databaseName=db_SanGiaoDichViecLamHN;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=dvvl_app
spring.datasource.password=Dvvl@2026!HaNoi
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.connection-timeout=15000

# Giữ nguyên quy ước đặt tên bảng & cột FIT HOU (Mục 2.2: tbl_*, PK_*, FK_*, s*, i*, f*, d*, b*)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# Upload CV PDF (<= 5MB), GPKD (<= 5MB) & Ảnh đại diện (<= 2MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB
app.upload.dir=./uploads

# JWT Cấu hình (NFR Bảo mật R33/R34)
app.jwt.secret=DVVL-HaNoi-SE-G01-2026-SecretKey-32BytesMinLength!
app.jwt.expiration-ms=86400000
app.security.max-failed-attempts=5
app.security.lock-minutes=15

# Chuẩn hóa Jackson JSON theo tên field (tránh trùng key từ getter tiền tố Hungarian s*/i*/f*/b*)
spring.jackson.visibility.field=any
spring.jackson.visibility.getter=none
spring.jackson.visibility.is-getter=none
spring.jackson.visibility.setter=none
